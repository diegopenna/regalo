let enabled=true,busy=false,audio,timer,raf;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const sound=document.getElementById('sound'),gift=document.getElementById('gift'),canvas=document.getElementById('confetti'),ctx=canvas.getContext('2d');document.getElementById('download').href=document.querySelector('.reveal img').src;
sound.onclick=()=>{enabled=!enabled;sound.textContent=enabled?'♫ Sonido activado':'♫ Sonido desactivado';sound.setAttribute('aria-pressed',enabled)};
function chime(){if(!enabled)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const t=audio.currentTime;[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+.6+i*.11);g.gain.linearRampToValueAtTime(.075,t+.62+i*.11);g.gain.exponentialRampToValueAtTime(.001,t+1.7+i*.11);o.connect(g);g.connect(audio.destination);o.start(t+.6+i*.11);o.stop(t+1.9+i*.11)})}catch(e){}}
function size(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}size();addEventListener('resize',size);
function confetti(){if(reduced)return;cancelAnimationFrame(raf);const colors=['#f1c778','#e995b4','#fff1cd','#c55e88'];let particles=Array.from({length:150},(_,i)=>({x:innerWidth/2,y:innerHeight*.48,vx:(Math.random()-.5)*13,vy:-5-Math.random()*13,r:Math.random()*6.28,spin:(Math.random()-.5)*.15,w:5+Math.random()*6,c:colors[i%4],heart:i%7===0}));let start=performance.now(),last=start;function frame(now){let step=Math.min((now-last)/16.67,2);last=now;ctx.clearRect(0,0,innerWidth,innerHeight);for(const p of particles){p.x+=p.vx*step;p.y+=p.vy*step;p.vy+=.13*step;p.vx*=Math.pow(.995,step);p.r+=p.spin*step;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;if(p.heart){ctx.font='16px serif';ctx.fillText('♥',-8,0)}else ctx.fillRect(-p.w/2,-3,p.w,6);ctx.restore()}if(now-start<6000)raf=requestAnimationFrame(frame);else ctx.clearRect(0,0,innerWidth,innerHeight)}raf=requestAnimationFrame(frame)}
gift.onclick=()=>{if(busy)return;busy=true;gift.disabled=true;chime();document.body.classList.add('opening');timer=setTimeout(()=>{document.body.classList.remove('opening');document.body.classList.add('revealed');confetti();document.getElementById('finalTitle').focus({preventScroll:true})},reduced?50:1400)};
document.getElementById('again').onclick=()=>{clearTimeout(timer);cancelAnimationFrame(raf);ctx.clearRect(0,0,innerWidth,innerHeight);document.body.classList.remove('opening','revealed');busy=false;gift.disabled=false;gift.focus({preventScroll:true});window.scrollTo(0,0)};
